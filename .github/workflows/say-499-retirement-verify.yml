name: Temporary SAY-499 retirement verification

on:
  pull_request:
    paths:
      - 'projects/nuinuiCAD/scripts/**'
      - 'projects/nuinuiCAD/LOCAL-TOOLS.md'
      - '.github/workflows/say-499-retirement-verify.yml'

permissions:
  contents: read

jobs:
  isolated-regression:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed PR contents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify shell syntax and retirement guards
        shell: bash
        run: |
          set -euo pipefail
          git config --global init.defaultBranch main
          /bin/sh -n projects/nuinuiCAD/scripts/generate-nuinui
          /bin/sh -n projects/nuinuiCAD/scripts/nuinui
          /bin/sh -n projects/nuinuiCAD/scripts/test-nuinui-generation
          /bin/sh -n projects/nuinuiCAD/scripts/test-nuinui-pr-auto-merge-retired
          /bin/sh -n projects/nuinuiCAD/scripts/test-nuinui-command-result
          /bin/sh projects/nuinuiCAD/scripts/test-nuinui-pr-auto-merge-retired projects/nuinuiCAD/scripts/nuinui

      - name: Verify deterministic generation and current helper behavior
        shell: bash
        run: |
          set -euo pipefail
          /bin/sh projects/nuinuiCAD/scripts/test-nuinui-generation
          /bin/sh projects/nuinuiCAD/scripts/test-nuinui-command-result projects/nuinuiCAD/scripts/nuinui
          helper="$GITHUB_WORKSPACE/projects/nuinuiCAD/scripts/nuinui"
          scripts="$GITHUB_WORKSPACE/projects/nuinuiCAD/scripts"
          /bin/sh "$scripts/test-nuinui-runtime" "$helper"
          /bin/sh "$scripts/test-nuinui-handoff-check"
          /bin/sh "$scripts/test-nuinui-handoff" "$helper"
          /bin/sh "$scripts/test-nuinui-topology-matrix" "$helper"
          /bin/sh "$scripts/test-nuinui-exact-fix" "$helper"
          /bin/sh "$scripts/test-nuinui-lifecycle" "$helper"
          /bin/sh "$scripts/test-nuinui-integration-clean" "$helper"
          /bin/sh "$scripts/test-nuinui-context-sync" "$helper"
          /bin/sh "$scripts/test-nuinui-source-budget"

  existing-e2e-locale-baseline:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout original unmodified dev-context main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: d20e48e11f5a1fbe77f9e8be2e07f5d1b0b2a1cd
      - name: Reproduce existing isolated E2E locale failure on baseline
        shell: bash
        run: |
          set -euo pipefail
          git config --global init.defaultBranch main
          rc=0
          /bin/zsh projects/nuinuiCAD/scripts/test-nuinui-e2e-prepare \
            projects/nuinuiCAD/scripts/nuinui-e2e-prepare > "$RUNNER_TEMP/e2e-baseline.log" 2>&1 || rc=$?
          tail -n 28 "$RUNNER_TEMP/e2e-baseline.log"
          [ "$rc" -ne 0 ] || { echo "Baseline did not reproduce failure"; exit 1; }
          grep -Fq 'SELFTEST FAIL: invalid cache failure was not actionable: missing-hash' \
            "$RUNNER_TEMP/e2e-baseline.log" || {
              echo "Baseline E2E failure differs from candidate"; exit 1;
            }
          echo 'BASELINE E2E ENVIRONMENT FAILURE REPRODUCED'
